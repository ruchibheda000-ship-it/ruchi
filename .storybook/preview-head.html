<!-- Google Analytics 4 (GA4) Global Site Tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-G4JQP7QYTE"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  // Initialize GA4 with ID (supports replacement via environment)
  var GA_ID = window.GA4_MEASUREMENT_ID || 'G-G4JQP7QYTE';
  gtag('config', GA_ID, {
    'send_page_view': true
  });

  // Track Storybook story navigation route events
  function trackStoryView() {
    var hash = window.location.hash || window.location.search;
    if (typeof gtag === 'function') {
      gtag('event', 'page_view', {
        page_title: document.title,
        page_location: window.location.href,
        page_path: hash || '/'
      });
      gtag('event', 'storybook_story_navigation', {
        story_id: hash
      });
    }
  }

  window.addEventListener('hashchange', trackStoryView);
  window.addEventListener('popstate', trackStoryView);
</script>
